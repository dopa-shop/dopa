<!doctype html>
<html><head><meta charset="utf-8"><title>model sheet</title>
<style>body{margin:0;background:#eee;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(var(--cols,8),1fr);gap:4px;padding:4px}figure{margin:0;background:#fff}img{width:100%;display:block}figcaption{padding:2px 4px}</style>
</head><body><div id="g"></div>
<script type="module">
import { ThumbFactory } from '../js/render3d.js';
import { MODELS } from '../js/models.js';
const tf = new ThumbFactory();
const keys = Object.keys(MODELS);
const only = new URLSearchParams(location.search).get('only');
const list = only ? keys.filter(k => only.split(',').includes(k)) : keys;
const g = document.getElementById('g'); g.style.setProperty('--cols', new URLSearchParams(location.search).get('cols')||8);
let done = 0; const t0 = performance.now();
for (const k of list) {
  const f = document.createElement('figure'); const img = new Image(); f.append(img); const cap = document.createElement('figcaption'); cap.textContent = k; f.append(cap); g.append(f);
  tf.get(k, { model: k, variant: {}, size: +(new URLSearchParams(location.search).get('size')||320), bg: ['#f3eefc', '#e2dcf0'] }).then(u => { img.src = u; if (++done === list.length) { window.__done = true; window.__ms = performance.now() - t0; } });
}
window.addEventListener('error', e => { window.__err = (window.__err||'') + e.message + '\n'; });
</script></body></html>
